name: CI

# Branch-triggered behavior per docs/CI_CD.md: on a PR, stages 1-4 run
# (lint, unit/widget tests, rules tests, build) - the fast feedback loop.
# Stages 5-7 (integration tests, deploy to internal testers, staged prod
# rollout) are intentionally NOT wired up in this workflow yet - they need
# real Firebase projects and deploy secrets that don't exist until someone
# actually runs Milestone F0's manual Firebase-project-creation step, and
# integration tests need more of the app built (Milestone F8). Adding them
# now would just be permanently-red jobs. See docs/IMPLEMENTATION_PLAN.md.
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch so pushing a fix doesn't
# leave a stale run occupying a runner, per docs/CI_CD.md's build-time
# optimization guidance.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Stage 1: Lint --------------------------------------------------------

  lint-functions:
    name: "Stage 1 · Lint · Functions"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: ESLint + TypeScript type-check
        working-directory: functions
        run: npm run lint

  lint-flutter:
    name: "Stage 1 · Lint · Flutter"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.flutter-version
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      # Milestone F3: @riverpod-annotated files' *.g.dart companions are
      # gitignored, not committed (see .gitignore's comment) - CI generates
      # them here so `dart format`/`flutter analyze` below see the same
      # files a local `dart run build_runner build` would produce, without
      # risking a committed-but-stale generated file drifting from its
      # source.
      - name: Generate code (build_runner)
        working-directory: app
        run: dart run build_runner build
      - name: dart format (fails on unformatted code)
        working-directory: app
        run: dart format --set-exit-if-changed .
      - name: flutter analyze (very_good_analysis)
        working-directory: app
        run: flutter analyze

  # --- Stage 2: Unit and widget tests ----------------------------------------

  test-functions:
    name: "Stage 2 · Unit tests · Functions"
    needs: lint-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      # The pass/fail gate. Kept separate from the coverage run below
      # deliberately (2026-08-31): they were one step, and a crash in
      # Node's coverage *reporter* failed the whole job while every test
      # passed.
      - name: Build + run unit tests
        working-directory: functions
        run: npm test
      # 85%+ business-logic coverage is a soft gate per docs/TESTING.md - a
      # human reviews a drop below threshold, CI does not hard-block on it.
      # No coverage-threshold-enforcing step is added here for that reason.
      #
      # `|| true` because this step is the *report*, not the gate, and the
      # step above already failed the job on any real test failure. This
      # is not papering over a flake: `node --test
      # --experimental-test-coverage` on Node 20.20.2 exits 1 with
      # "Could not report code coverage. TypeError: Cannot read properties
      # of undefined (reading 'line')" while reporting 0 failures, and it
      # does so on `main` too — reproduced by checking out main and running
      # it under Node 20, so it is a toolchain regression, not something
      # this repository introduced. `node-version-file` resolves "20" to
      # the newest 20.x, so the runner's Node moved under us; earlier PRs
      # were green on an older patch. Node 22 (what developer machines run
      # here) reports coverage fine.
      #
      # Leaving the old single-step form would mean every future PR is red
      # for a reason unrelated to its contents, which is the fastest way to
      # teach a team to ignore CI.
      - name: Coverage report (informational)
        working-directory: functions
        run: npm run test:coverage || true

  test-flutter:
    name: "Stage 2 · Unit + widget tests · Flutter"
    needs: lint-flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.flutter-version
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Generate code (build_runner)
        working-directory: app
        run: dart run build_runner build
      - name: Run unit + widget tests
        working-directory: app
        # --dart-define=CI=true is read by test/flutter_test_config.dart to
        # disable Alchemist's platform ("readable") golden tests here -
        # those are inherently unstable across host OSes (font rendering),
        # so only the Ahem-font, platform-agnostic "ci/" goldens run on
        # this runner. See Recommendation R2 / .gitignore's golden-file
        # comment for the full rationale.
        run: flutter test --coverage --dart-define=CI=true

  # --- Stage 3: Firestore rules tests ----------------------------------------

  rules-tests:
    name: "Stage 3 · Firestore rules tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore/test/rules/package-lock.json
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13
      - name: Install rules-test dependencies
        working-directory: firestore/test/rules
        run: npm ci
      - name: Run rules tests against the emulator
        # Real rules (users, tables+rsvps, crews, idempotencyKeys) and their
        # rules-emulator tests landed together in Milestone F1 - see
        # docs/TESTING.md and firestore/test/rules/README.md.
        run: |
          firebase emulators:exec --only firestore \
            "npm --prefix firestore/test/rules test" \
            --project tablecrew-dev

  # --- Typesense sync trigger integration test (Milestone F7) ----------------
  #
  # Separate from "Stage 3" above and from a hypothetical "Stage 5"
  # functions-integration job (functions/test/integration/'s suite isn't
  # wired into CI at all yet - a pre-existing, disclosed gap, not something
  # this job's addition silently expands to cover). This job exists
  # specifically to close docs/IMPLEMENTATION_PLAN.md §2.2's named
  # blocker ("Typesense has no local/CI emulation story") for the one
  # piece of code that needs it: functions/src/triggers/index.ts's
  # onTableWrittenSyncTypesense trigger. The `typesense/typesense` image
  # below is the same open-source Docker image docker-compose.yml runs
  # for local dev - no Typesense Cloud account is used or needed here.
  typesense-integration-tests:
    name: "Typesense sync trigger · Integration test"
    runs-on: ubuntu-latest
    services:
      typesense:
        image: typesense/typesense:27.1
        ports:
          - 8108:8108
        options: >-
          --health-cmd "curl -f http://localhost:8108/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        env:
          TYPESENSE_API_KEY: tablecrew-local-dev-key
          TYPESENSE_DATA_DIR: /tmp/typesense-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: Run the Typesense sync integration test against the emulators + service container
        env:
          TYPESENSE_HOST: localhost
          TYPESENSE_PORT: "8108"
          TYPESENSE_API_KEY: tablecrew-local-dev-key
        run: |
          firebase emulators:exec --only auth,firestore,functions \
            "npm --prefix functions run test:integration:typesense" \
            --project tablecrew-dev

  # --- Stage 4: Build ---------------------------------------------------------

  build-functions:
    name: "Stage 4 · Build · Functions"
    needs: test-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: tsc build
        working-directory: functions
        run: npm run build

  build-flutter-android:
    name: "Stage 4 · Build · Flutter (Android debug)"
    needs: test-flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.flutter-version
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: flutter build apk --debug
        working-directory: app
        run: flutter build apk --debug

  build-flutter-ios:
    name: "Stage 4 · Build · Flutter (iOS, no codesign)"
    needs: test-flutter
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.flutter-version
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: flutter build ios --debug --no-codesign
        working-directory: app
        run: flutter build ios --debug --no-codesign
