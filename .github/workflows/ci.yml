name: CI

# Branch-triggered behavior per docs/CI_CD.md: on a PR, stages 1-4 run
# (lint, unit/widget tests, rules tests, build) - the fast feedback loop.
# Stages 5-7 (integration tests, deploy to internal testers, staged prod
# rollout) are intentionally NOT wired up in this workflow yet - they need
# real Firebase projects and deploy secrets that don't exist until someone
# actually runs Milestone F0's manual Firebase-project-creation step, and
# integration tests need more of the app built (Milestone F8). Adding them
# now would just be permanently-red jobs. See docs/IMPLEMENTATION_PLAN.md.
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch so pushing a fix doesn't
# leave a stale run occupying a runner, per docs/CI_CD.md's build-time
# optimization guidance.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Stage 1: Lint --------------------------------------------------------

  lint-functions:
    name: "Stage 1 · Lint · Functions"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: ESLint + TypeScript type-check
        working-directory: functions
        run: npm run lint

  lint-flutter:
    name: "Stage 1 · Lint · Flutter"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.flutter-version
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      # Milestone F3: @riverpod-annotated files' *.g.dart companions are
      # gitignored, not committed (see .gitignore's comment) - CI generates
      # them here so `dart format`/`flutter analyze` below see the same
      # files a local `dart run build_runner build` would produce, without
      # risking a committed-but-stale generated file drifting from its
      # source.
      - name: Generate code (build_runner)
        working-directory: app
        run: dart run build_runner build
      - name: dart format (fails on unformatted code)
        working-directory: app
        run: dart format --set-exit-if-changed .
      - name: flutter analyze (very_good_analysis)
        working-directory: app
        run: flutter analyze

  # --- Stage 2: Unit and widget tests ----------------------------------------

  test-functions:
    name: "Stage 2 · Unit tests · Functions"
    needs: lint-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      # The pass/fail gate. Kept separate from the coverage run below
      # deliberately (2026-08-31): they were one step, and a crash in
      # Node's coverage *reporter* failed the whole job while every test
      # passed.
      - name: Build + run unit tests
        working-directory: functions
        run: npm test
      # 85%+ business-logic coverage is a soft gate per docs/TESTING.md - a
      # human reviews a drop below threshold, CI does not hard-block on it.
      # No coverage-threshold-enforcing step is added here for that reason.
      #
      # `|| true` because this step is the *report*, not the gate, and the
      # step above already failed the job on any real test failure. This
      # is not papering over a flake: `node --test
      # --experimental-test-coverage` on Node 20.20.2 exits 1 with
      # "Could not report code coverage. TypeError: Cannot read properties
      # of undefined (reading 'line')" while reporting 0 failures, and it
      # does so on `main` too — reproduced by checking out main and running
      # it under Node 20, so it is a toolchain regression, not something
      # this repository introduced. `node-version-file` resolves "20" to
      # the newest 20.x, so the runner's Node moved under us; earlier PRs
      # were green on an older patch. Node 22 (what developer machines run
      # here) reports coverage fine.
      #
      # Leaving the old single-step form would mean every future PR is red
      # for a reason unrelated to its contents, which is the fastest way to
      # teach a team to ignore CI.
      - name: Coverage report (informational)
        working-directory: functions
        run: npm run test:coverage || true

  test-flutter:
    name: "Stage 2 · Unit + widget tests · Flutter"
    needs: lint-flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.flutter-version
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Generate code (build_runner)
        working-directory: app
        run: dart run build_runner build
      - name: Run unit + widget tests
        working-directory: app
        # --dart-define=CI=true is read by test/flutter_test_config.dart to
        # disable Alchemist's platform ("readable") golden tests here -
        # those are inherently unstable across host OSes (font rendering),
        # so only the Ahem-font, platform-agnostic "ci/" goldens run on
        # this runner. See Recommendation R2 / .gitignore's golden-file
        # comment for the full rationale.
        run: flutter test --coverage --dart-define=CI=true

  # --- Stage 3: Firestore rules tests ----------------------------------------

  rules-tests:
    name: "Stage 3 · Firestore rules tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore/test/rules/package-lock.json
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13
      - name: Install rules-test dependencies
        working-directory: firestore/test/rules
        run: npm ci
      - name: Run rules tests against the emulator
        # Real rules (users, tables+rsvps, crews, idempotencyKeys) and their
        # rules-emulator tests landed together in Milestone F1 - see
        # docs/TESTING.md and firestore/test/rules/README.md.
        run: |
          firebase emulators:exec --only firestore \
            "npm --prefix firestore/test/rules test" \
            --project tablecrew-dev

  # --- Typesense sync trigger integration test (Milestone F7) ----------------
  #
  # Separate from "Stage 3" above and from a hypothetical "Stage 5"
  # functions-integration job (functions/test/integration/'s suite isn't
  # wired into CI at all yet - a pre-existing, disclosed gap, not something
  # this job's addition silently expands to cover). This job exists
  # specifically to close docs/IMPLEMENTATION_PLAN.md §2.2's named
  # blocker ("Typesense has no local/CI emulation story") for the one
  # piece of code that needs it: functions/src/triggers/index.ts's
  # onTableWrittenSyncTypesense trigger. The `typesense/typesense` image
  # below is the same open-source Docker image docker-compose.yml runs
  # for local dev - no Typesense Cloud account is used or needed here.
  typesense-integration-tests:
    name: "Typesense sync trigger · Integration test"
    runs-on: ubuntu-latest
    # Two fixes, 2026-08-31, after this job's first-ever real run failed at
    # "Initialize containers" with "Service container typesense failed."
    # GitHub Actions service containers support only image/env/ports/
    # options/volumes — there is no `command:`, so docker-compose.yml's
    # `--data-dir /data --api-key=... --enable-cors` cannot be carried over
    # and has to be expressed as env vars. That much the original already
    # did; what it got wrong:
    #
    #  1. TYPESENSE_DATA_DIR pointed at /tmp/typesense-data, which does not
    #     exist inside the image. typesense-server exits rather than
    #     creating it, so the container was dead before any health check
    #     ran. /tmp always exists.
    #  2. The health check ran `curl` *inside* the Typesense container. The
    #     official image is minimal and is not guaranteed to ship curl; if
    #     it does not, the check can never pass and Actions reports the
    #     service as failed even when the server is healthy. Readiness is
    #     now polled from the runner, which definitely has curl, against
    #     the mapped port.
    #
    # Both were plausible causes of the same message and the log does not
    # distinguish them, so both are fixed rather than one guessed at. The
    # "Typesense container logs on failure" step below exists so the next
    # failure here diagnoses itself instead of costing another round trip.
    services:
      typesense:
        image: typesense/typesense:27.1
        ports:
          - 8108:8108
        env:
          TYPESENSE_API_KEY: tablecrew-local-dev-key
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_ENABLE_CORS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Typesense to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8108/health; then
              echo "Typesense is up."
              exit 0
            fi
            sleep 2
          done
          echo "Typesense did not become healthy within 60s."
          exit 1
      - name: Typesense container logs on failure
        if: failure()
        run: docker ps -a && docker logs "$(docker ps -aq --filter ancestor=typesense/typesense:27.1 | head -1)" || true
      - uses: actions/setup-node@v4
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # Java 21 is required by firebase-tools 15.x, and is set up explicitly
      # rather than relying on whatever the runner image defaults to.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Pinned to the version that demonstrably works, rather than the 13.x
      # this job was written against. firebase-tools 13's Functions emulator
      # runtime loads `firebase-functions/lib/v2/index.js` — the whole v2
      # barrel — which pulls in the Realtime Database provider, then
      # firebase-admin's database module, then `@firebase/database-compat`,
      # which declares `@firebase/app` as a **peerDependency** that is not
      # installed in this tree. The emulator then dies with "Cannot find
      # module '@firebase/app'" before it can run our trigger. Nothing in
      # this codebase uses Realtime Database; the dependency is dragged in
      # entirely by that eager barrel import.
      #
      # 15.25.1 is what every local run of these suites uses (54/54 green on
      # the founder's machine, repeatedly), and it does not take that code
      # path. Installing the missing peer was tried first and is a dead end:
      # the current `@firebase/app` (0.16.1) fails with
      # ERR_PACKAGE_PATH_NOT_EXPORTED against database-compat 2.1.5, so it
      # would mean pinning a guessed-at older version of a package we do not
      # use, to satisfy a peer we do not want, for a provider we never call.
      #
      # The `rules-tests` job is deliberately left on 13.x: it is green, it
      # never starts the Functions emulator, and churning a passing job to
      # remove version drift is not worth the risk. That drift is recorded
      # in TASKS.md rather than silently carried.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.25.1
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      # MUST run before `emulators:exec`, not inside the script it invokes.
      # The Functions emulator scans for functions at startup, so a build
      # that happens inside the exec'd command is always too late — the
      # emulator has already logged "lib/index.js does not exist" and loaded
      # nothing by then. The package.json scripts also build, which is
      # correct for their own sake but cannot fix load ordering.
      - name: Build functions (before the emulator loads them)
        working-directory: functions
        run: npm run build
      - name: Run the Typesense sync integration test against the emulators + service container
        env:
          TYPESENSE_HOST: localhost
          TYPESENSE_PORT: "8108"
          TYPESENSE_API_KEY: tablecrew-local-dev-key
        run: |
          firebase emulators:exec --only auth,firestore,functions \
            "npm --prefix functions run test:integration:typesense" \
            --project tablecrew-dev

  # --- Stage 4: Build ---------------------------------------------------------

  build-functions:
    name: "Stage 4 · Build · Functions"
    needs: test-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: tsc build
        working-directory: functions
        run: npm run build

  build-flutter-android:
    name: "Stage 4 · Build · Flutter (Android debug)"
    needs: test-flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.flutter-version
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      # *.g.dart is gitignored (.gitignore), so a clean checkout has no
      # generated sources and `flutter build` cannot resolve the `part`
      # directive on every @riverpod provider. lint-flutter and test-flutter
      # have had this step since F3; these two build jobs never got it,
      # which is why TASKS.md has recorded them as "never run anywhere"
      # since F0 — they could not have passed.
      - name: Generate code (build_runner)
        working-directory: app
        run: dart run build_runner build
      # google-services.json is gitignored on purpose — .gitignore files it
      # under "Environment / secrets", and ENGINEERING_GUIDELINES tells new
      # engineers to get it from their onboarding buddy rather than the repo.
      # CI therefore has to be given it, and a repository secret is the way
      # that keeps the existing decision intact. Fails loudly with the fix
      # rather than letting Gradle report a confusing missing-file error.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Repository secret GOOGLE_SERVICES_JSON_BASE64 is not set."
            echo "  base64 -i app/android/app/google-services.json | gh secret set GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          # A secret pasted as the raw file rather than its base64 encoding
          # is the likely mistake, and 'base64: invalid input' does not say
          # so. Detect it and name it.
          case "$GOOGLE_SERVICES_JSON_BASE64" in
            *'"project_info"'*|'{'*)
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 looks like raw JSON, not base64."
              echo "The secret must hold the *encoded* form. Regenerate it with:"
              echo "  base64 -i app/android/app/google-services.json | gh secret set GOOGLE_SERVICES_JSON_BASE64"
              exit 1
              ;;
          esac
          # tr strips the line wrapping some base64 implementations add and
          # any stray whitespace from a copy-paste; GNU base64 -d rejects it.
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' \
            | base64 --decode > app/android/app/google-services.json
          if ! head -c 1 app/android/app/google-services.json | grep -q '{'; then
            echo "::error::Decoded google-services.json does not start with '{' — the secret decoded to something unexpected."
            exit 1
          fi
          echo "google-services.json written and looks like JSON."
      - name: flutter build apk --debug
        working-directory: app
        run: flutter build apk --debug

  build-flutter-ios:
    name: "Stage 4 · Build · Flutter (iOS, no codesign)"
    needs: test-flutter
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.flutter-version
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      # *.g.dart is gitignored (.gitignore), so a clean checkout has no
      # generated sources and `flutter build` cannot resolve the `part`
      # directive on every @riverpod provider. lint-flutter and test-flutter
      # have had this step since F3; these two build jobs never got it,
      # which is why TASKS.md has recorded them as "never run anywhere"
      # since F0 — they could not have passed.
      - name: Generate code (build_runner)
        working-directory: app
        run: dart run build_runner build
      # Same reasoning as the Android job's google-services.json step.
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::Repository secret GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set."
            echo "  base64 -i app/ios/Runner/GoogleService-Info.plist | gh secret set GOOGLE_SERVICE_INFO_PLIST_BASE64"
            exit 1
          fi
          case "$GOOGLE_SERVICE_INFO_PLIST_BASE64" in
            *'<?xml'*|*'<plist'*)
              echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 looks like a raw plist, not base64."
              echo "The secret must hold the *encoded* form. Regenerate it with:"
              echo "  base64 -i app/ios/Runner/GoogleService-Info.plist | gh secret set GOOGLE_SERVICE_INFO_PLIST_BASE64"
              exit 1
              ;;
          esac
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | tr -d '[:space:]' \
            | base64 --decode > app/ios/Runner/GoogleService-Info.plist
          if ! grep -q "plist" app/ios/Runner/GoogleService-Info.plist; then
            echo "::error::Decoded GoogleService-Info.plist does not look like a plist."
            exit 1
          fi
          echo "GoogleService-Info.plist written and looks like a plist."
      - name: flutter build ios --debug --no-codesign
        working-directory: app
        run: flutter build ios --debug --no-codesign
