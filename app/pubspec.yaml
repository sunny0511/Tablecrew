name: tablecrew
description: >
  TableCrew Flutter client. See docs/ARCHITECTURE.md and
  docs/ENGINEERING_GUIDELINES.md for the architecture and conventions this
  app follows.
publish_to: "none"
version: 0.1.0

environment:
  # Pinned per Milestone F0 / Recommendation R5. The actual toolchain version
  # (not just this SDK constraint) is pinned in app/.flutter-version and
  # referenced by .github/workflows/ci.yml, since pubspec's environment.sdk
  # is a constraint range by Dart's own design, not an exact single-version
  # pin — the real "exact pin" lives in .flutter-version.
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management (docs/ENGINEERING_GUIDELINES.md "State Management:
  # Riverpod" — chosen over Bloc/plain Provider; see docs/adr/0001).
  #
  # Milestone F3 correction: originally pinned to 2.5.1/2.3.5 (Milestone F0),
  # a reasoned guess with no real pub.dev access to verify. The founder's
  # first real `flutter pub get` (Flutter 3.44.8/Dart 3.12.2, Milestone F3)
  # found that pin didn't even resolve — riverpod_generator 2.4.3's
  # transitive analyzer/macros constraints are incompatible with current
  # Dart tooling outright, not just "outdated." Riverpod itself has also
  # moved to a new major version (2.x -> 3.x) since Milestone F0. Bumped to
  # the exact versions `flutter pub outdated`'s "Resolvable" column reported
  # as the real, mutually-consistent set (not hand-picked "latest" per
  # package, since latest-per-package is exactly what failed to resolve).
  # `app/lib/core/auth_state.dart` was written against Riverpod 2.x
  # conventions and needs re-verification against 3.x — tracked as a
  # follow-up in this milestone, not silently assumed compatible.
  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  # Routing. Declared and version-pinned since Milestone F0 per
  # Recommendation R5, wired up starting Milestone F3 — see
  # docs/IMPLEMENTATION_PLAN.md. Bumped 14.2.7 -> 17.3.0 for the same reason
  # as the Riverpod packages above (real `flutter pub outdated` result).
  go_router: 17.3.0
  # Firebase — first two Flutter Firebase plugins added Milestone F2, for
  # app/lib/core/auth_state.dart's auth-state provider (docs/API_SPEC.md
  # §3.9's Phone/OTP sign-up needs firebase_auth on the client; firebase_core
  # is FlutterFire's mandatory bootstrap dependency every other Firebase
  # plugin requires). Bumped 3.6.0/5.3.1 -> 4.12.1/6.5.6 (Milestone F3, real
  # `flutter pub outdated` result) — the Milestone F2 pins were a reasoned
  # guess made with no pub.dev access; these are the real, verified-resolvable
  # current versions.
  firebase_core: 4.12.1
  firebase_auth: 6.5.6
  # OfflineMutationQueue (Recommendation R1, core/offline/). Added via
  # `flutter pub add` (real resolver), then re-pinned from the default
  # caret ranges to exact versions per R5, same treatment as every other
  # dependency in this file:
  # - uuid: generates the client-side UUID v4 idempotency key
  #   docs/API_SPEC.md §2 / functions/src/shared/index.ts's
  #   isWellFormedIdempotencyKey require.
  # - shared_preferences: persists the mutationId -> idempotencyKey map
  #   locally so a retry (even across an app restart) reuses the same
  #   key rather than minting a new one, per API_SPEC.md §2's explicit
  #   requirement.
  # - connectivity_plus: online/offline signal the queue uses to avoid
  #   attempting a call it already knows will fail, and to know when to
  #   surface a pending mutation as retryable.
  uuid: 4.6.0
  connectivity_plus: 7.3.1
  shared_preferences: 2.5.5
  # Firestore/Functions/Storage clients for
  # app/lib/data/user_profile_repository.dart and photo_upload_repository.dart
  # (Milestone F5). Added via `flutter pub add` (real resolver) then
  # re-pinned from the default caret ranges to exact versions, matching
  # every other dependency in this file per Recommendation R5.
  cloud_firestore: 6.7.1
  cloud_functions: 6.3.5
  firebase_storage: 13.4.5
  # Screens 2-3 (Milestone F5). Re-pinned here from the default caret
  # ranges `flutter pub add` left in place — a gap in the prior pass that
  # went unnoticed until this file was touched again, not a deliberate
  # exception to Recommendation R5's exact-pin policy every other
  # dependency in this file follows.
  intl_phone_field: 3.2.0
  pinput: 6.0.2
  # Screens 5/7 (Milestone F5). Added via a real `flutter pub add`
  # (founder's machine, real resolver) then re-pinned from the default
  # caret ranges to exact versions per Recommendation R5.
  # - image_picker: Screen 5's required profile-photo picker (camera or
  #   library).
  # - permission_handler: Screen 7's OS notification-permission request —
  #   chosen over `firebase_messaging` since FCM token registration itself
  #   is explicitly deferred to Milestone F8 (`features/account/README.md`);
  #   this screen only needs the OS permission prompt, not a token.
  image_picker: 1.2.3
  permission_handler: 13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Lint preset (docs/ENGINEERING_GUIDELINES.md "Dart/Flutter Code Style" —
  # chosen over hand-rolled effective_dart rules; see docs/adr/ for the
  # ADR index). Bumped 6.0.0 -> 10.3.0, same real-`pub-outdated` basis as
  # the dependencies above.
  very_good_analysis: 10.3.0
  # Bumped 2.4.3 -> 4.0.4 / 2.4.13 -> 2.15.1 — see flutter_riverpod's
  # comment above; 2.4.3 was the pin that failed to resolve outright.
  riverpod_generator: 4.0.4
  build_runner: 2.15.1
  # Golden/visual-regression testing (Recommendation R2). R2 originally
  # named `golden_toolkit`; as of this milestone `golden_toolkit` is
  # discontinued and `alchemist` (Very Good Ventures) is the maintained
  # standard that superseded it — corrected here and in
  # docs/IMPLEMENTATION_PLAN.md's R2 text in the same pass, not just here.
  # Added via `flutter pub add --dev alchemist` (real resolver, not a
  # hand-picked guess) then re-pinned from its default `^0.14.0` caret to an
  # exact version, matching every other dependency in this file per
  # Recommendation R5's "pin exact versions" policy.
  alchemist: 0.14.0
  # Milestone F5 task #96: hand-written fakes implement each repository's
  # `abstract interface class` directly (see
  # `features/onboarding/data/phone_auth_repository.dart`'s doc comment for
  # why the interface/impl split exists), but two of `firebase_auth`'s own
  # leaf return types — `UserCredential`/`User` — have no public
  # constructor at all (confirmed via pub.dev's real API docs, not
  # assumed), so no hand-written fake can produce one by construction.
  # `mocktail`'s `Mock` base class sidesteps this by routing through
  # `noSuchMethod` instead of a real constructor — the standard,
  # widely-documented pattern for exactly this problem. Used narrowly, only
  # to stand in for those two leaf SDK types inside `test/fakes/`; the
  # repositories themselves stay hand-written fakes, not mocktail mocks.
  # Added via `flutter pub add --dev mocktail` (real resolver — resolved to
  # 1.0.5), re-pinned from the default `^1.0.5` caret to an exact version
  # per Recommendation R5, matching every other dependency in this file.
  mocktail: 1.0.5
  # Milestone F5 task #96e: `image_picker`/`permission_handler` are used
  # directly by `profile_setup_screen.dart`/`notification_priming_screen.dart`
  # with no repository layer in front of them (unlike
  # `connectivity_plus`/`firebase_auth`/Firestore, which all go through this
  # codebase's repository pattern) — see `FakeImagePickerPlatform`'s doc
  # comment (`test/fakes/`) for why. Both packages' real platform channel
  # implementations throw under a plain `flutter test`, so their widget
  # tests substitute a fake at each package's own `Platform.instance` seam
  # instead, which requires importing these platform-interface packages
  # directly — previously only resolved transitively (see them already
  # present, at these exact versions, in `pubspec.lock`). Declared here
  # rather than left transitive-only so `test/fakes/`'s imports resolve;
  # versions match `pubspec.lock`'s already-resolved transitive pins
  # exactly, not independently re-resolved.
  image_picker_platform_interface: 2.11.1
  permission_handler_platform_interface: 4.4.0

# Milestone F0 note, resolved Milestone F2/F3/F5: this section used to list
# which Firebase Flutter plugins were deliberately not yet pinned pending
# real `pub get` access. firebase_core/firebase_auth landed F2;
# cloud_firestore/cloud_functions/firebase_storage landed F5 (see their
# entries above). image_picker also landed F5 (see Screens 5/7 entry
# above) — the note used to name it as still-pending; it's the last of
# the originally-listed packages to land. Still deliberately not yet
# pinned: firebase_messaging, firebase_app_check, firebase_crashlytics,
# firebase_analytics — each lands in the milestone that first needs it.

flutter:
  uses-material-design: true

  # Bundled (not runtime-fetched) fonts, per docs/DESIGN_SYSTEM.md §2.1's
  # explicit rationale: "matters for build size, licensing simplicity, and
  # consistent rendering across Flutter's cross-platform font-embedding
  # pipeline" — i.e. deliberately not the `google_fonts` package, which
  # fetches over the network at runtime and would show a fallback font on
  # first launch offline. Only the weights docs/DESIGN_SYSTEM.md §2.2's type
  # scale actually uses are bundled, not every static cut Google Fonts ships:
  #
  # - Inter: Regular (400), Medium (500), SemiBold (600) — covers
  #   type.body.lg/md, type.caption, type.button, type.heading.lg/md.
  #   Downloaded at the "18pt" optical-size cut (Inter's static export
  #   splits by optical size; 18pt is tuned for our 12-22px UI-text range,
  #   not the 24pt/28pt cuts meant for larger display-scale text).
  # - Fraunces: Regular (400) only, used at weight 400 for both
  #   type.display.lg/md. Design system §2.2 specifies weight 500 (Medium),
  #   but this static export's weight stops (Thin/Light/Regular/SemiBold/
  #   Bold/Black) skip 500 entirely — no Medium cut exists to download.
  #   Regular is the closer reasoned substitute of the two available
  #   neighbors (vs. jumping to SemiBold), since the design rationale
  #   describes Fraunces here as evoking "a handwritten menu or invitation
  #   card" — an airier, less assertive feel Regular preserves better than
  #   SemiBold would at 26-34px display sizes. Flagged here and in
  #   app/lib/core/theme/type_tokens.dart, not silently substituted.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces_72pt-Regular.ttf
          weight: 400
