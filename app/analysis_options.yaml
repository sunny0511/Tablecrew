# Lint ruleset: very_good_analysis, layered on top of core Dart lints.
# See docs/ENGINEERING_GUIDELINES.md "Dart/Flutter Code Style" for why this
# was chosen over flutter_lints or a hand-rolled effective_dart ruleset.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/**"
    # Milestone F5: `flutter build apk`'s iOS Swift Package Manager prep step
    # (a Flutter tooling quirk that runs even for Android-only builds) copies
    # each Firebase plugin's full source — including its own test/ and
    # example/ directories, which are written against *that plugin's*
    # dependencies, not this app's — into build/ios/SourcePackages/. Without
    # this exclude, `flutter analyze` walks that vendored copy as if it were
    # project code and reports ~1500 issues that have nothing to do with
    # TableCrew. build/ is gitignored and regenerated per machine, so
    # excluding it here is just telling the analyzer to stay inside the
    # actual project the same way git already does.
    - "build/**"

linter:
  rules:
    # very_good_analysis already enforces public_member_api_docs; explicitly
    # noted here (rather than silently relied upon) since
    # docs/ENGINEERING_GUIDELINES.md's "Documentation Standards" section
    # makes doc comments on public classes/functions a stated requirement,
    # not just a lint nicety.
    public_member_api_docs: true
    # pubspec.yaml deliberately groups dependencies by feature/milestone with
    # explanatory comments (see that file) rather than alphabetically — that
    # grouping is itself documentation of *why* each dependency was added,
    # which alphabetizing would destroy. Disabling the default
    # sort_pub_dependencies rule here is resolving a real conflict between a
    # generic lint default and this project's own documented pubspec
    # convention, not ignoring a legitimate finding.
    sort_pub_dependencies: false
